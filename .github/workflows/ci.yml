# CI: the Fragiola project jobs (from Grid Layout and Dockable), with the Playwright suites split
# out of Checks.
#
#   Checks   Biome, TypeScript, the unit tests and the build (with the .d.ts check), then the
#            bundle size report.
#   Package  `pnpm check:package`: builds and packs every package with pnpm, lints the tarballs
#            (dist-only exports, publint, attw), checks the React package pins the core's exact
#            version, then installs it into a scratch Vite + React app outside the workspace that
#            typechecks, builds and loads its dev server.
#   Changesets  on a pull request, `pnpm changeset status` fails when the PR changes what a
#            package ships (`changedFilePatterns` in .changeset/config.json) without adding a
#            changeset. Skipped for the Version Packages PR (changeset-release/*), which consumes
#            them.
#   E2E      the Playwright suites, in parallel jobs: the playground (Chromium, Firefox and the
#            `mobile` project) from source, and the examples app (Chromium), whose embed builds
#            against the packages' dist, so its job builds the packages.
#   E2E (WebKit mobile)  the playground's mobile specs in WebKit on an iPhone's viewport: a
#            report, never a gate (continue-on-error).
#   Site export  `pnpm site:export --base /dnd`, self-validated against the www contract.
#
# Tests run only on pull requests (and on a manual run): with one coordinator merging one PR at a
# time, main is what its PR tested. A push to main runs release.yml: the Version Packages PR, or
# the npm publish (whose pack job runs `scripts/check-package.ts --tarballs` on the very tarballs
# it publishes). No www trigger yet: DnD is not registered on fragiola.com.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # a report, never a gate: the bundle sizes in the job summary
      - run: pnpm size

  package:
    name: Package
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # builds the packages first, then packs, lints and smoke-tests the tarballs
      - run: pnpm check:package

  changesets:
    name: Changesets
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--since` diffs from the merge base with the base branch: the full history is needed
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # the root's tools only (@changesets/cli): the check reads the packages' manifests and git
      - run: pnpm install --frozen-lockfile --filter "{.}"

      - name: A changeset for every package change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset status --since="origin/$BASE_REF"

  e2e:
    name: E2E (playground)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/playground
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Run Playwright
        run: pnpm --filter playground run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-playground
          path: apps/playground/playwright-report/
          retention-days: 14

  e2e-examples:
    name: E2E (examples)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The examples suite builds the embed against the packages' dist.
      - name: Build the packages
        run: pnpm --filter "./packages/*" build

      - name: Install Playwright Chromium
        working-directory: examples/react
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm --filter examples-react run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-examples
          path: examples/react/playwright-report/
          retention-days: 14

  e2e-webkit:
    name: E2E (WebKit mobile)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # a report, never a gate: WebKit in CI can be slow or flaky
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright WebKit
        working-directory: apps/playground
        run: pnpm exec playwright install --with-deps webkit

      - name: Run the mobile specs in WebKit
        working-directory: apps/playground
        env:
          PLAYWRIGHT_WEBKIT: "1"
        run: pnpm exec playwright test --project webkit-mobile

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit-mobile
          path: apps/playground/playwright-report/
          retention-days: 14

  site-export:
    name: Site export
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm site:export --base /dnd --out "$RUNNER_TEMP/site-export"
