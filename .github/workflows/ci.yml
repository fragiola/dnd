# CI: the Fragiola project jobs (from Grid Layout and Dockable), with the Playwright suites split
# out of Checks.
#
#   Checks   Biome, TypeScript, the unit tests and the build (with the .d.ts check), then the
#            bundle size report.
#   Package  `pnpm check:package`: builds and packs every package with pnpm (the Angular one
#            from its ng-packagr `dist`), lints the tarballs (dist-only exports, publint, attw),
#            checks each adapter pins the core's exact version, then installs each adapter into
#            its own scratch app outside the workspace (Vite + React; Vite + Vue, vue-tsc on
#            TypeScript 6.0; Vite + Analog, ngc with strict templates on TypeScript 6.0) that
#            typechecks, builds and loads its dev server.
#   Changesets  on a pull request, `pnpm changeset status` fails when the PR changes what a
#            package ships (`changedFilePatterns` in .changeset/config.json) without adding a
#            changeset. Skipped for the Version Packages PR (changeset-release/*), which consumes
#            them.
#   Changes  the E2E suites the pull request can affect (scripts/e2e-suites.ts, a `git diff`
#            against the base; Epic #27, from fragiola/data-grid): none for docs only (site/docs,
#            *.md, AGENTS.md); packages/react or examples/react: the playground and examples
#            react; packages/vue or examples/vue: examples vue; packages/angular or
#            examples/angular: examples angular; anything else (the core, examples/shared, the
#            playground, the lockfile, root configs, .github, scripts, site) and a manual run:
#            every suite. It also lists the frameworks with an examples app (every
#            `examples/<framework>` with a playwright.config.ts: react, vue, angular).
#   E2E      the Playwright suites it selects, in parallel jobs, in Playwright's image
#            (mcr.microsoft.com/playwright, the tag of @playwright/test: no browser install;
#            Epic #27): the playground (Chromium, Firefox and the `mobile` project) from source,
#            and one job per framework's examples app, each running the shared specs of
#            examples/shared/e2e against its own embed (Chromium). An examples embed builds
#            against the packages' dist, so its job builds the packages. No shards: each suite's
#            tests take about 2 minutes or less.
#            No WebKit job (Dockable has one): the playground's mobile specs drive touch through
#            Chromium's DevTools protocol, which WebKit does not have, so every one of them fails
#            there (`PLAYWRIGHT_WEBKIT=1` still adds the project locally).
#   Site export  `pnpm site:export --base /dnd`, self-validated against the www contract.
#
# Tests run only on pull requests (and on a manual run): with one coordinator merging one PR at a
# time, main is what its PR tested. A push to main runs release.yml: the Version Packages PR, or
# the npm publish (whose pack job runs `scripts/check-package.ts --tarballs` on the very tarballs
# it publishes). No www trigger yet: DnD is not registered on fragiola.com.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # a report, never a gate: the bundle sizes in the job summary
      - run: pnpm size

  package:
    name: Package
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # builds the packages first, then packs, lints and smoke-tests the tarballs
      - run: pnpm check:package

  changesets:
    name: Changesets
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--since` diffs from the merge base with the base branch: the full history is needed
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # the root's tools only (@changesets/cli): the check reads the packages' manifests and git
      - run: pnpm install --frozen-lockfile --filter "{.}"

      - name: A changeset for every package change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset status --since="origin/$BASE_REF"

  changes:
    name: Changes
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      playground: ${{ steps.suites.outputs.playground }}
      examples: ${{ steps.suites.outputs.examples }}
    steps:
      # a pull request checks out its merge commit: its first parent is the base it merges into
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: suites
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            node scripts/e2e-suites.ts --diff HEAD^1
          else
            node scripts/e2e-suites.ts --all
          fi

  # The E2E jobs run in Playwright's image, whose browsers and system libraries match
  # @playwright/test (its tag follows the version; site/tests/ci-workflow.test.ts checks it), so
  # they install nothing.
  e2e:
    name: E2E (playground)
    needs: changes
    if: needs.changes.outputs.playground == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Playwright
        run: pnpm --filter playground run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-playground
          path: apps/playground/playwright-report/
          retention-days: 14

  e2e-examples:
    name: E2E (examples ${{ matrix.framework }})
    needs: changes
    if: needs.changes.outputs.examples != '[]' && needs.changes.outputs.examples != ''
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(needs.changes.outputs.examples) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The examples suite builds the embed against the packages' dist (examplesE2eConfig): the
      # Angular package through ng-packagr.
      - name: Build the packages
        run: pnpm --filter "./packages/*" build

      - name: Run Playwright
        run: pnpm --filter examples-${{ matrix.framework }} run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-examples-${{ matrix.framework }}
          path: examples/${{ matrix.framework }}/playwright-report/
          retention-days: 14

  site-export:
    name: Site export
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm site:export --base /dnd --out "$RUNNER_TEMP/site-export"
