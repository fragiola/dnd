# CI: the Fragiola project jobs (from Grid Layout and Dockable), with the Playwright suites split
# out of Checks.
#
#   Checks   Biome, TypeScript, the unit tests and the build (with the .d.ts check), then the
#            bundle size report.
#   Package  `pnpm check:package`: builds and packs every package with pnpm (the Angular one
#            from its ng-packagr `dist`), lints the tarballs (dist-only exports, publint, attw),
#            checks each adapter pins the core's exact version, then installs each adapter into
#            its own scratch app outside the workspace (Vite + React; Vite + Vue, vue-tsc on
#            TypeScript 6.0; Vite + Analog, ngc with strict templates on TypeScript 6.0) that
#            typechecks, builds and loads its dev server.
#   Changesets  on a pull request, `pnpm changeset status` fails when the PR changes what a
#            package ships (`changedFilePatterns` in .changeset/config.json) without adding a
#            changeset. Skipped for the Version Packages PR (changeset-release/*), which consumes
#            them.
#   E2E      the Playwright suites, in parallel jobs: the playground (Chromium, Firefox and the
#            `mobile` project) from source, and one job per framework's examples app (every
#            `examples/<framework>` with a playwright.config.ts, found by the Examples apps job:
#            react, vue, angular), each running the shared specs of examples/shared/e2e against
#            its own embed (Chromium). An examples embed builds against the packages' dist, so
#            its job builds the packages, and installs the Playwright of its own app.
#   E2E (WebKit mobile)  the playground's mobile specs in WebKit on an iPhone's viewport: a
#            report, never a gate (continue-on-error).
#   Site export  `pnpm site:export --base /dnd`, self-validated against the www contract.
#
# Tests run only on pull requests (and on a manual run): with one coordinator merging one PR at a
# time, main is what its PR tested. A push to main runs release.yml: the Version Packages PR, or
# the npm publish (whose pack job runs `scripts/check-package.ts --tarballs` on the very tarballs
# it publishes). No www trigger yet: DnD is not registered on fragiola.com.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # a report, never a gate: the bundle sizes in the job summary
      - run: pnpm size

  package:
    name: Package
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # builds the packages first, then packs, lints and smoke-tests the tarballs
      - run: pnpm check:package

  changesets:
    name: Changesets
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--since` diffs from the merge base with the base branch: the full history is needed
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # the root's tools only (@changesets/cli): the check reads the packages' manifests and git
      - run: pnpm install --frozen-lockfile --filter "{.}"

      - name: A changeset for every package change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset status --since="origin/$BASE_REF"

  e2e:
    name: E2E (playground)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/playground
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Run Playwright
        run: pnpm --filter playground run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-playground
          path: apps/playground/playwright-report/
          retention-days: 14

  # The frameworks that have an examples app: every examples/<framework> with a playwright.config.ts
  # (examples/shared, the specs every framework runs, has none). Adding an app adds its job.
  examples-apps:
    name: Examples apps
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      frameworks: ${{ steps.list.outputs.frameworks }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        run: |
          frameworks=$(ls examples/*/playwright.config.ts | cut -d/ -f2 | jq -Rnc '[inputs]')
          echo "frameworks=$frameworks" >> "$GITHUB_OUTPUT"
          echo "examples apps: $frameworks"

  e2e-examples:
    name: E2E (examples ${{ matrix.framework }})
    needs: examples-apps
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(needs.examples-apps.outputs.frameworks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The examples suite builds the embed against the packages' dist (examplesE2eConfig): the
      # Angular package through ng-packagr.
      - name: Build the packages
        run: pnpm --filter "./packages/*" build

      - name: Install Playwright Chromium
        working-directory: examples/${{ matrix.framework }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm --filter examples-${{ matrix.framework }} run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-examples-${{ matrix.framework }}
          path: examples/${{ matrix.framework }}/playwright-report/
          retention-days: 14

  e2e-webkit:
    name: E2E (WebKit mobile)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # a report, never a gate: WebKit in CI can be slow or flaky
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright WebKit
        working-directory: apps/playground
        run: pnpm exec playwright install --with-deps webkit

      - name: Run the mobile specs in WebKit
        working-directory: apps/playground
        env:
          PLAYWRIGHT_WEBKIT: "1"
        run: pnpm exec playwright test --project webkit-mobile

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit-mobile
          path: apps/playground/playwright-report/
          retention-days: 14

  site-export:
    name: Site export
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm site:export --base /dnd --out "$RUNNER_TEMP/site-export"
